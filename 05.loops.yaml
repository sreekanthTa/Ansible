- name: loops
  hosts: local
  tasks:
  - name: print names
    ansible.builtin.debug:
        msg: "Hello {{item}}"
    loop:
      - Linux
      - Shell

  - name: install packages
    ansible.builtin.dnf:
      name: "{{ item }}"
      state: latest
    loop:
    - nginx
    - postfix

  - name: install packages
    ansible.builtin.apt:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop:
    - { name: 'mysql', state: 'latest'} # item
    - { name: 'nginx', state: 'absent'}
    - { name: 'postfix', state: 'absent'}