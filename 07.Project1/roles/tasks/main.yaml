---
- name: Install Apache
  package:
    name: "{{ apache_package }}"
    state: present

- name: Start Apache service
  service:
    name: "{{ service_name }}"
    state: started
    enabled: yes
  notify: restart apache

- name: Deploy index.html using template
  template:
    src: index.html.j2
    dest: "{{ web_root }}/index.html"

